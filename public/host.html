<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RF-Quiz — ведущий</title>
<link rel="icon" href="/icon.jpg">
<link rel="apple-touch-icon" href="/icon.jpg">
<meta name="apple-mobile-web-app-title" content="RF-Quiz">
<link rel="stylesheet" href="/style.css">
<style>
  body { overflow-x: hidden; }
  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: calc(16px + env(safe-area-inset-top, 0px)) clamp(16px, 4vw, 48px) 16px;
    background: linear-gradient(var(--bg) 70%, transparent);
  }
  .top .info { color: var(--muted); font-weight: 600; font-size: 15px; }
  .top .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .main {
    padding: 8px clamp(16px, 4vw, 48px) calc(120px + env(safe-area-inset-bottom, 0px));
    max-width: 1280px;
    margin: 0 auto;
  }
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: center; gap: 12px;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(transparent, var(--bg) 35%);
  }
  .actionbar .btn { height: 60px; padding: 0 36px; font-size: 19px; border-radius: 16px; min-width: 260px; }
  .actionbar .hint { position: absolute; bottom: 4px; font-size: 12px; color: var(--faint); }

  h1 { font-size: clamp(34px, 5vw, 64px); letter-spacing: -.035em; line-height: 1.05; margin: 0; }
  .muted { color: var(--muted); }

  /* Лобби */
  .lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(24px, 4vw, 64px); align-items: start; margin-top: 3vh; }
  .joinbox { display: flex; flex-direction: column; gap: 22px; }
  .url {
    font-size: clamp(24px, 3.2vw, 42px);
    font-weight: 700;
    letter-spacing: -.02em;
    word-break: break-all;
  }
  .url small { display: block; font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 6px; }
  .qr { width: min(300px, 70vw); aspect-ratio: 1; padding: 18px; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .warn { background: #fff4e5; color: #8a4b00; padding: 14px 18px; border-radius: 14px; }
  .players-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .players-head .count { font-size: 56px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px;
    background: var(--card);
    border: 0;
    border-radius: 999px;
    box-shadow: var(--shadow);
    font-size: 18px; font-weight: 600;
    transition: background .2s ease, color .2s ease, opacity .2s ease;
  }
  .chip.off { opacity: .45; }
  .chip.confirm { background: var(--bad); color: #fff; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .chip.off .dot { background: var(--faint); }
  .chip.done { background: var(--ink); color: #fff; }
  .chip.done .dot { background: #fff; }
  .empty { color: var(--faint); font-size: 18px; padding: 28px 0; }

  /* Вопрос */
  .qhead { display: flex; gap: 32px; align-items: flex-start; justify-content: space-between; margin-top: 2vh; }
  .qtitle { font-size: clamp(28px, 3.6vw, 52px); font-weight: 750; letter-spacing: -.03em; line-height: 1.12; margin: 8px 0 0; }
  .ring { position: relative; width: 120px; height: 120px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .ring .bg { stroke: var(--soft); }
  .ring .fg { stroke: var(--ink); stroke-linecap: round; transition: stroke .3s ease; }
  .ring.low .fg { stroke: var(--bad); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; font-weight: 800; }
  .qbody { display: flex; gap: 32px; margin-top: 28px; align-items: stretch; }
  .qbody .qimg { flex: 0 0 38%; max-height: 46vh; object-fit: contain; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); }
  .grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
  .answer {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 16px;
    min-height: 92px;
    padding: 18px 22px 18px 18px;
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    font-size: clamp(18px, 1.8vw, 26px);
    font-weight: 650;
    transition: opacity .4s ease, box-shadow .3s ease;
  }
  .answer .shape { width: 50px; height: 50px; border-radius: 14px; }
  .answer .shape svg { width: 24px; height: 24px; }
  .explain {
    margin-top: 22px;
    padding: 20px 24px;
    border-radius: 18px;
    background: rgba(255, 255, 255, .75);
    box-shadow: var(--shadow);
    font-size: clamp(16px, 1.4vw, 20px);
    line-height: 1.5;
    color: #3a3a44;
  }
  .explain b { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .quiz-title { font-size: clamp(22px, 2.4vw, 30px); font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .emoji { font-size: 1.15em; line-height: 1; }
  .answer .t { flex: 1; position: relative; z-index: 1; overflow-wrap: anywhere; }
  .answer .cnt { position: relative; z-index: 1; font-weight: 800; }
  .answer .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); opacity: .12; width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  .revealed .answer { opacity: .38; }
  .revealed .answer.right { opacity: 1; box-shadow: inset 0 0 0 3px var(--good), var(--shadow); }
  .revealed .answer.right .fill { background: var(--good); opacity: .16; }
  .answered { margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
  .answered .big { font-size: 20px; font-weight: 600; }

  /* Лидеры */
  .lb { max-width: 760px; margin: 3vh auto 0; }
  .lb h1 { margin-bottom: 26px; text-align: center; }
  .lb .row { padding: 18px 24px; font-size: 20px; }
  .lb .row .pos { width: 36px; }
  .lb .row .delta { font-size: 16px; min-width: 70px; }
  .lb .podium { max-width: 640px; margin: 0 auto 28px; }
  .lb .podium .who { font-size: 22px; }
  .lb .podium .step { font-size: 36px; }
  .lb .podium .p1 .step { height: 200px; }
  .lb .podium .p2 .step { height: 150px; }
  .lb .podium .p3 .step { height: 110px; }

  @media (max-width: 820px) {
    .lobby { grid-template-columns: 1fr; }
    .qbody { flex-direction: column; }
    .qbody .qimg { flex: none; width: 100%; }
    .grid { grid-template-columns: 1fr; }
    .ring { width: 84px; height: 84px; }
    .ring span { font-size: 28px; }
    .actionbar .btn { min-width: 0; width: 100%; }
    .top .info { display: none; }
  }
</style>
</head>
<body>
<div class="top">
  <span class="logo"><img class="logo-mark" src="/icon.jpg" alt="">RF-Quiz</span>
  <span class="info num" id="info"></span>
  <div class="tools">
    <button class="btn small ghost" id="soundBtn" title="Звук на экране ведущего"></button>
    <a class="btn small ghost" id="editorLink" href="/editor" target="_blank">Вопросы</a>
    <button class="btn small ghost" id="resetBtn" hidden>Сбросить игру</button>
  </div>
</div>

<main class="main" id="main"></main>

<div class="actionbar" id="actionbar" hidden>
  <button class="btn" id="primary"></button>
  <span class="hint">или нажмите пробел</span>
</div>

<div class="conn" id="conn" hidden>Нет связи с сервером…</div>

<script src="/qrcode.js"></script>
<script src="/shapes.js"></script>
<script src="/hostauth.js"></script>
<script src="/sound.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString('ru-RU');
const RING = 2 * Math.PI * 52;

let state = null;
let renderedKey = '';
let primaryAction = null;
let timerEnd = 0, timerTotal = 1, raf = 0, connTimer = 0;
let resetArmed = false;
let kickArmed = null;
const seenPlayers = new Set();


function toast(text) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function act(name, body = {}) {
  try {
    const r = await fetch('/api/host/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Host-Key': KEY },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Ошибка');
  } catch (e) { toast(e.message); }
}

function connect() {
  const es = new EventSource('/events' + (KEY ? '?key=' + encodeURIComponent(KEY) : ''));
  es.onmessage = (e) => {
    clearTimeout(connTimer);
    $('#conn').hidden = true;
    render(JSON.parse(e.data));
  };
  es.onerror = () => {
    clearTimeout(connTimer);
    connTimer = setTimeout(() => ($('#conn').hidden = false), 1500);
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2000);
  };
}

// ---------- Отрисовка ----------

function render(s) {
  const prev = state;
  state = s;
  const key = s.phase + ':' + s.index;
  const fresh = key !== renderedKey;
  renderedKey = key;
  playSounds(prev, s, fresh);

  $('#info').textContent = s.phase === 'lobby' ? `Вопросов: ${s.total}` : s.phase === 'final' ? 'Итоги' : `Вопрос ${s.index + 1} из ${s.total}`;
  $('#resetBtn').hidden = s.phase === 'lobby';
  $('#editorLink').hidden = !(s.phase === 'lobby' || s.phase === 'final');

  if (s.phase === 'lobby') renderLobby(s, fresh);
  else if (s.phase === 'question' || s.phase === 'reveal') renderQuestion(s, fresh);
  else renderBoard(s, fresh);
}

function playSounds(prev, s, fresh) {
  if (!prev) return; // первое подключение — без звуков
  if (fresh) {
    if (s.phase === 'question') Sound.question();
    else if (s.phase === 'reveal') Sound.reveal();
    else if (s.phase === 'leaderboard') Sound.board();
    else if (s.phase === 'final') Sound.final();
    return;
  }
  const had = new Set(prev.players.map((p) => p.id));
  if (s.phase === 'lobby' && s.players.some((p) => !had.has(p.id))) Sound.join();
  if (s.phase === 'question' && s.answeredCount > prev.answeredCount) Sound.answer();
}

function updateSoundBtn() {
  $('#soundBtn').textContent = Sound.enabled ? '🔊 Звук' : '🔇 Звук';
}
updateSoundBtn();
$('#soundBtn').addEventListener('click', () => { Sound.toggle(); updateSoundBtn(); });

let lastTickSec = 0;

function setPrimary(label, action, disabled = false) {
  $('#actionbar').hidden = !label;
  const b = $('#primary');
  b.textContent = label || '';
  b.disabled = disabled;
  primaryAction = disabled ? null : action;
}

function renderLobby(s, fresh) {
  if (fresh) {
    stopTimer();
    const url = s.joinUrls[0];
    $('#main').innerHTML = `
      <div class="lobby fade-in">
        <div class="joinbox">
          ${s.title ? `<p class="quiz-title">${esc(s.title)}</p>` : ''}
          <p class="eyebrow">${url && url.startsWith('https') ? 'Откройте на телефоне' : 'Подключайтесь к Wi‑Fi и откройте'}</p>
          ${url
            ? `<div class="url">${esc(url.replace(/^https?:\/\//, ''))}${s.joinUrls.length > 1 ? `<small>или: ${s.joinUrls.slice(1).map((u) => esc(u.replace(/^https?:\/\//, ''))).join(', ')}</small>` : ''}</div>
               <div class="card qr" id="qr"></div>
               <p class="muted" style="margin:0">Наведите камеру iPhone на QR‑код</p>`
            : `<div class="warn">Компьютер не подключён к Wi‑Fi. Подключитесь к сети и перезапустите сервер.</div>`}
        </div>
        <div>
          <div class="players-head"><p class="eyebrow">Участники</p><span class="count num" id="pcount"></span></div>
          <div class="chips" id="chips"></div>
        </div>
      </div>`;
    if (url && window.qrcode) {
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      $('#qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    }
  }
  $('#pcount').textContent = s.players.length;
  $('#chips').innerHTML = s.players.length
    ? s.players.map((p) => `<button class="chip ${seenPlayers.has(p.id) ? '' : 'pop'} ${p.connected ? '' : 'off'} ${kickArmed === p.id ? 'confirm' : ''}" data-id="${p.id}" title="Нажмите, чтобы удалить"><span class="emoji">${p.emoji}</span>${kickArmed === p.id ? 'Удалить ' + esc(p.name) + '?' : esc(p.name)}</button>`).join('')
    : `<div class="empty">Пока никого нет<span class="dots" style="margin-left:6px"><span></span><span></span><span></span></span></div>`;
  s.players.forEach((p) => seenPlayers.add(p.id));
  const n = s.players.length;
  if (!s.total) setPrimary('Сначала добавьте вопросы', null, true);
  else setPrimary(n ? `Начать игру · ${n} ${plural(n, 'участник', 'участника', 'участников')}` : 'Ждём участников…', () => act('start'), !n);
}

function renderQuestion(s, fresh) {
  const q = s.question;
  const revealed = s.phase === 'reveal';
  if (fresh && (s.phase === 'question' || !$('#answers'))) {
    $('#main').innerHTML = `
      <div class="fade-in">
        <div class="qhead">
          <div>
            <p class="eyebrow num">Вопрос ${s.index + 1} из ${s.total}</p>
            <div class="qtitle">${esc(q.text)}</div>
          </div>
          <div class="ring" id="ring">
            <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52" stroke-dasharray="${RING}"/></svg>
            <span class="num"></span>
          </div>
        </div>
        <div class="qbody">
          ${q.image ? `<img class="qimg" src="${esc(q.image)}" alt="">` : ''}
          <div class="grid" id="answers">
            ${q.answers.map((a, i) => `<div class="answer c${i}"><span class="fill"></span>${shape(i)}<span class="t">${esc(a)}</span><span class="cnt num"></span></div>`).join('')}
          </div>
        </div>
        <div id="explain"></div>
        <div class="answered">
          <span class="big num" id="answeredText"></span>
          <div class="chips" id="answeredChips"></div>
        </div>
      </div>`;
  }

  const online = s.players.filter((p) => p.connected || p.answered);
  $('#answeredText').textContent = `Ответили ${s.answeredCount} из ${online.length}`;
  $('#answeredChips').innerHTML = online.map((p) => `<span class="chip ${p.answered ? 'done' : 'off'}" style="font-size:15px;padding:8px 14px"><span class="emoji">${p.emoji}</span>${esc(p.name)}</span>`).join('');

  const grid = $('#answers');
  grid.classList.toggle('revealed', revealed);
  const total = Math.max(1, s.answeredCount);
  grid.querySelectorAll('.answer').forEach((el, i) => {
    el.classList.toggle('right', revealed && i === q.correct);
    const n = revealed ? s.distribution[i] : 0;
    el.querySelector('.cnt').textContent = revealed ? n : '';
    requestAnimationFrame(() => (el.querySelector('.fill').style.width = revealed ? (n / total) * 100 + '%' : '0'));
  });

  if (revealed) {
    stopTimer();
    $('#ring').classList.remove('low');
    $('#ring .fg').style.strokeDashoffset = RING;
    $('#ring span').textContent = '✓';
    if (q.explanation && !$('#explain').innerHTML) {
      $('#explain').innerHTML = `<div class="explain fade-in"><b>Пояснение</b>${esc(q.explanation)}</div>`;
    }
    const last = s.index >= s.total - 1;
    setPrimary(last ? 'Показать итоги' : 'Таблица лидеров', () => act('next'));
  } else {
    startTimer(q.remaining, q.time * 1000);
    setPrimary('Показать ответ', () => act('reveal'));
  }
}

function renderBoard(s, fresh) {
  stopTimer();
  const final = s.phase === 'final';
  const list = s.leaderboard;
  const shown = final ? list.slice(3, 12) : list.slice(0, 10);
  $('#main').innerHTML = `
    <div class="lb ${fresh ? 'fade-in' : ''}">
      <h1>${final ? 'Победители' : 'Таблица лидеров'}</h1>
      ${final ? `<div class="podium">${list.slice(0, 3).map((p, i) => `
        <div class="place p${i + 1} ${fresh ? 'pop' : ''}" style="animation-delay:${(2 - i) * 0.5}s">
          <div style="font-size:52px;line-height:1">${p.emoji}</div>
          <div class="who">${esc(p.name)}</div><div class="pts num">${fmt(p.score)}</div><div class="step">${i + 1}</div>
        </div>`).join('')}</div>` : ''}
      <div class="board">${shown.map((p, i) => `
        <div class="row ${fresh ? 'fade-in' : ''} ${p.rank <= 3 ? 'top' + p.rank : ''}" style="animation-delay:${i * 0.05}s">
          <span class="pos num">${p.rank}</span>
          <span class="name"><span class="emoji" style="margin-right:8px">${p.emoji}</span>${esc(p.name)}${p.connected ? '' : ' <span class="muted" style="font-weight:400;font-size:14px">· офлайн</span>'}</span>
          ${!final && p.lastPoints ? `<span class="delta num">+${fmt(p.lastPoints)}</span>` : ''}
          <span class="score num">${fmt(p.score)}</span>
        </div>`).join('')}</div>
    </div>`;
  if (final) setPrimary('Новая игра', () => act('reset'));
  else setPrimary('Следующий вопрос', () => act('next'));
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

// ---------- Таймер ----------

function startTimer(remaining, total) {
  timerEnd = performance.now() + remaining;
  timerTotal = total;
  if (!raf) tick();
}
function stopTimer() { cancelAnimationFrame(raf); raf = 0; }
function tick() {
  const ring = $('#ring');
  if (!ring) return (raf = 0);
  const left = Math.max(0, timerEnd - performance.now());
  ring.querySelector('.fg').style.strokeDashoffset = RING * (1 - left / timerTotal);
  const sec = Math.ceil(left / 1000);
  ring.querySelector('span').textContent = sec;
  if (sec !== lastTickSec) {
    if (sec >= 1 && sec <= 5 && lastTickSec > sec) Sound.tick(sec === 1);
    lastTickSec = sec;
  }
  ring.classList.toggle('low', left < 5000);
  raf = left > 0 ? requestAnimationFrame(tick) : 0;
}

// ---------- Управление ----------

$('#primary').addEventListener('click', () => primaryAction && primaryAction());

document.addEventListener('keydown', (e) => {
  if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && primaryAction && document.activeElement?.tagName !== 'INPUT') {
    e.preventDefault();
    primaryAction();
  }
});

$('#main').addEventListener('click', (e) => {
  const chip = e.target.closest('#chips .chip');
  if (!chip) return;
  if (kickArmed === chip.dataset.id) {
    kickArmed = null;
    act('kick', { id: chip.dataset.id });
  } else {
    kickArmed = chip.dataset.id;
    renderLobby(state, false);
    setTimeout(() => { if (kickArmed === chip.dataset.id) { kickArmed = null; state.phase === 'lobby' && renderLobby(state, false); } }, 3000);
  }
});

$('#resetBtn').addEventListener('click', () => {
  const b = $('#resetBtn');
  if (resetArmed) {
    resetArmed = false;
    b.textContent = 'Сбросить игру';
    b.classList.remove('danger');
    return act('reset');
  }
  resetArmed = true;
  b.textContent = 'Точно сбросить?';
  b.classList.add('danger');
  setTimeout(() => { resetArmed = false; b.textContent = 'Сбросить игру'; b.classList.remove('danger'); }, 3000);
});

requireHost(connect);
</script>
</body>
</html>
